{{- $fullname := include "patchbay.fullname" . -}}
{{- $sa := include "patchbay.controllerServiceAccountName" . -}}
# The controller: the only decider and the only status writer (design §5).
# It watches only this namespace, so its RBAC is a namespaced Role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "patchbay.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "patchbay.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
rules:
  # Least privilege (docs/plans/release-a.md §7.2 lists who writes what).
  # It never deletes anything: owned Secrets go with their resource
  # (ownerReference GC), and nothing may remove Helm's release Secrets.
  #
  # Its resources: read only. It never edits their spec or metadata (a
  # request annotation is acted on once, recorded in status).
  - apiGroups: [patchbay.chrismiller.xyz]
    resources: [phones, softphones, people, streams]
    verbs: [get, list, watch]
  # Their status: it is the only writer (Status().Update).
  - apiGroups: [patchbay.chrismiller.xyz]
    resources: [phones/status, softphones/status, people/status, streams/status]
    verbs: [update]
  # The device Secrets it creates are owned by their Phone or Softphone with
  # blockOwnerDeletion, which the API server allows only to whoever may
  # update the owner's finalizers.
  - apiGroups: [patchbay.chrismiller.xyz]
    resources: [phones/finalizers, softphones/finalizers]
    verbs: [update]
  # Its cache lists and watches every ConfigMap of the namespace (pbx-config,
  # and the settings an Event may regard); it creates pbx-config, and
  # updates only that one.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ $fullname }}-pbx-config]
    verbs: [update]
  # Secrets: it creates and completes the device Secrets
  # (patchbay-<device ID>, one name per resource, so no resourceNames),
  # <fullname>-ami, <fullname>-agent-token and <fullname>-pbx-secrets; its
  # cache watches them all, and a softphone's token rotation updates one in
  # place.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update]
  # Events: discovery, state changes, actions, the bundle (events.k8s.io),
  # and leader election (the core API).
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  # Leader election: client-go's Lease lock creates the install's Lease,
  # then gets and renews only it.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [{{ $fullname }}-controller.patchbay.chrismiller.xyz]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "patchbay.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "patchbay.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "patchbay.selectorLabels" (dict "ctx" . "component" "controller") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "patchbay.labels" . | nindent 8 }}
        app.kubernetes.io/component: controller
      annotations:
        # The controller reads its settings once, at start: a change rolls it.
        checksum/settings: {{ include "patchbay.settingsJSON" . | sha256sum }}
        {{- with .Values.controller.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $sa }}
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: {{ include "patchbay.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - controller
            - --namespace=$(POD_NAMESPACE)
            - --fullname={{ $fullname }}
            - --settings-file=/etc/patchbay/settings/settings.json
            - --agent-url=http://{{ $fullname }}-agent.{{ .Release.Namespace }}.svc:{{ .Values.pbx.ports.control }}
            - --leader-elect={{ .Values.controller.leaderElect }}
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --zap-log-level={{ .Values.controller.logLevel }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: probes
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: probes
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- with .Values.controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: settings
              mountPath: /etc/patchbay/settings
              readOnly: true
      volumes:
        - name: settings
          configMap:
            name: {{ $fullname }}-settings
            items:
              - key: settings.json
                path: settings.json
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
