{{- $fullname := include "patchbay.fullname" . -}}
{{- $p := .Values.pbx -}}
{{- $address := include "patchbay.pbxAddress" . -}}
{{- $nodeName := required "pbx.nodeName is required: the node the PBX is pinned to (its kubernetes.io/hostname)" $p.nodeName -}}
{{- if lt (int $p.ports.rtpEnd) (int $p.ports.rtpStart) -}}
{{- fail "pbx.ports.rtpEnd must not be below pbx.ports.rtpStart" -}}
{{- end -}}
# The PBX pod (design §6): Asterisk plus the agent as a native sidecar, on the
# host network of one pinned node. The agent senses and acts; it never
# decides, and today it holds no Kubernetes credentials at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "patchbay.agentServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "patchbay.labels" . | nindent 4 }}
    app.kubernetes.io/component: pbx
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-pbx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "patchbay.labels" . | nindent 4 }}
    app.kubernetes.io/component: pbx
spec:
  # One PBX per install. Recreate, because host ports cannot overlap: the old
  # pod must release 5060 before the new one binds it (calls drop on upgrade).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "patchbay.selectorLabels" (dict "ctx" . "component" "pbx") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "patchbay.labels" . | nindent 8 }}
        app.kubernetes.io/component: pbx
      annotations:
        {{- if $p.staticConfig.enabled }}
        checksum/static-config: {{ include (print $.Template.BasePath "/pbx-static-config.yaml") . | sha256sum }}
        {{- end }}
        {{- with $p.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "patchbay.agentServiceAccountName" . }}
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: {{ $nodeName | quote }}
      {{- with $p.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $p.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        # Both containers get this group: the agent writes the live config
        # with it, and Asterisk reads it.
        fsGroup: {{ $p.fsGroup }}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Native sidecar (restartPolicy: Always): it starts first, and
        # Asterisk starts only once its startup probe passes. When apply
        # exists, /readyz means "the first config version is applied", so
        # Asterisk never starts without valid config (design §5).
        - name: agent
          image: {{ include "patchbay.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          restartPolicy: Always
          args:
            - agent
            - --listen=:{{ $p.ports.control }}
            - --token-file=/var/run/patchbay/agent-token/token
            - --zap-log-level={{ $p.agent.logLevel }}
          ports:
            - name: control
              containerPort: {{ $p.ports.control }}
              protocol: TCP
            - name: tftp
              containerPort: {{ $p.ports.tftp }}
              protocol: UDP
            - name: cisco-http
              containerPort: {{ $p.ports.ciscoHTTP }}
              protocol: TCP
            - name: device-http
              containerPort: {{ $p.ports.deviceHTTP }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: control
            periodSeconds: 2
            failureThreshold: 150
          readinessProbe:
            httpGet:
              path: /readyz
              port: control
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: control
            periodSeconds: 20
            timeoutSeconds: 5
          # Non-root today. When the agent serves TFTP on port 69 it must run as
          # uid 0 with only NET_BIND_SERVICE: Kubernetes gives non-root
          # containers no ambient capabilities, so adding the capability to
          # uid 65532 does not let it bind (measured in e2e, docs/e2e.md).
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- with $p.agent.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /var/lib/patchbay/config
            - name: agent-token
              mountPath: /var/run/patchbay/agent-token
              readOnly: true
            {{- if .Values.firmware.persistence.enabled }}
            - name: firmware
              mountPath: /var/lib/patchbay/firmware
            {{- end }}
      containers:
        - name: asterisk
          image: {{ include "patchbay.imageRef" $p.asterisk.image | quote }}
          imagePullPolicy: {{ $p.asterisk.image.pullPolicy }}
          # Run Asterisk directly as its own user: no root entrypoint, no
          # chown, no -U/-p privilege drop. -f: foreground; -n: no colour
          # codes in the log.
          command: [/usr/sbin/asterisk]
          args:
            - -f
            - -n
            {{- if gt (int $p.asterisk.verbosity) 0 }}
            - -{{ repeat (int $p.asterisk.verbosity) "v" }}
            {{- end }}
            - -C
            - /etc/asterisk/asterisk.conf
          ports:
            - name: sip-udp
              containerPort: {{ $p.ports.sip }}
              protocol: UDP
            - name: sip-tcp
              containerPort: {{ $p.ports.sip }}
              protocol: TCP
          startupProbe:
            exec:
              command: [/usr/sbin/asterisk, -rx, core waitfullybooted]
            periodSeconds: 2
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [/usr/sbin/asterisk, -rx, core show uptime]
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            runAsUser: {{ $p.asterisk.runAsUser }}
            runAsGroup: {{ $p.asterisk.runAsGroup }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- with $p.asterisk.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if $p.staticConfig.enabled }}
            # TEMPORARY (e2e only): the static config, until the agent applies.
            - name: static-config
              mountPath: /etc/asterisk
              readOnly: true
            {{- else }}
            # The live config the agent applies. The compiler owns every file
            # Asterisk loads; none of the image's stock configs are used.
            - name: config
              mountPath: /etc/asterisk
              readOnly: true
            {{- end }}
            - name: asterisk-run
              mountPath: /var/run/asterisk
            - name: asterisk-spool
              mountPath: /var/spool/asterisk
            - name: asterisk-log
              mountPath: /var/log/asterisk
      volumes:
        - name: config
          emptyDir: {}
        - name: agent-token
          secret:
            secretName: {{ include "patchbay.agentTokenSecretName" . }}
            defaultMode: 0440
        {{- if $p.staticConfig.enabled }}
        - name: static-config
          secret:
            secretName: {{ $fullname }}-asterisk-static
            defaultMode: 0440
        {{- end }}
        # Asterisk's writable state: control socket, astdb and spool, logs.
        # The image's root filesystem stays read-only.
        - name: asterisk-run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: asterisk-spool
          emptyDir:
            sizeLimit: 256Mi
        - name: asterisk-log
          emptyDir:
            sizeLimit: 256Mi
        {{- if .Values.firmware.persistence.enabled }}
        - name: firmware
          persistentVolumeClaim:
            claimName: {{ $fullname }}-firmware
        {{- end }}
---
# The agent's control API, for the controller (and `patchbay` via the API
# server). The pod is on the host network, so its endpoint is the node IP.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "patchbay.labels" . | nindent 4 }}
    app.kubernetes.io/component: pbx
spec:
  type: ClusterIP
  selector:
    {{- include "patchbay.selectorLabels" (dict "ctx" . "component" "pbx") | nindent 4 }}
  ports:
    - name: control
      port: {{ $p.ports.control }}
      targetPort: control
      protocol: TCP
{{- if .Values.firmware.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-firmware
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "patchbay.labels" . | nindent 4 }}
    app.kubernetes.io/component: pbx
  {{- if .Values.firmware.persistence.keep }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.firmware.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.firmware.persistence.size }}
{{- end }}
