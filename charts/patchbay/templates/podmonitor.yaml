{{- if .Values.podMonitor.enabled -}}
# Scrapes the controller's metrics (its metrics port) and the agent's
# (/metrics on the control port, which needs no token; design §7). Each
# endpoint names a port only one of the two pods has. Needs the
# prometheus-operator CRDs.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "patchbay.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "patchbay.labels" . | nindent 4 }}
    {{- with .Values.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "patchbay.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [controller, pbx]
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.podMonitor.interval }}
    - port: control
      path: /metrics
      interval: {{ .Values.podMonitor.interval }}
{{- end }}
