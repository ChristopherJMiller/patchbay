{{- if .Values.podMonitor.enabled -}}
# Scrapes the controller's metrics (its metrics port), and the agent's and
# the stream bridge's (/metrics on their control ports, which need no
# token; design §7). Each endpoint names a port: metrics only the
# controller has, control the PBX pod and the bridge. Needs the
# prometheus-operator CRDs.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "patchbay.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "patchbay.labels" . | nindent 4 }}
    {{- with .Values.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "patchbay.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [controller, pbx{{ if .Values.streamBridge.enabled }}, stream-bridge{{ end }}]
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.podMonitor.interval }}
    - port: control
      path: /metrics
      interval: {{ .Values.podMonitor.interval }}
{{- end }}
