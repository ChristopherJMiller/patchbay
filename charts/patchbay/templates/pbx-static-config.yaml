{{- if .Values.pbx.staticConfig.enabled -}}
{{- $p := .Values.pbx -}}
{{- $s := $p.staticConfig -}}
{{- $address := include "patchbay.pbxAddress" . -}}
{{- $password := required "pbx.staticConfig.password is required when pbx.staticConfig.enabled (a test-only password)" $s.password -}}
{{- $endpoint := required "pbx.staticConfig.endpoint is required" $s.endpoint -}}
# TEMPORARY, e2e only. A hand-written Asterisk config mounted straight into
# Asterisk until the agent applies compiled bundles (design §5). It is a
# Secret, not a ConfigMap, because pjsip.conf carries a password. It already
# follows the compiler's rules: it owns all of /etc/asterisk, modules.conf
# has autoload=no, AMI binds 127.0.0.1 only and Asterisk's HTTP is off.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "patchbay.fullname" . }}-asterisk-static
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "patchbay.labels" . | nindent 4 }}
    app.kubernetes.io/component: pbx
  annotations:
    patchbay.chrismiller.xyz/temporary: "e2e-only static Asterisk config; replaced by the compiled bundle"
type: Opaque
stringData:
  asterisk.conf: |
    [directories]
    astetcdir => /etc/asterisk
    astmoddir => /usr/lib/asterisk/modules
    astvarlibdir => /var/lib/asterisk
    astdatadir => /var/lib/asterisk
    astkeydir => /var/lib/asterisk
    astagidir => /var/lib/asterisk/agi-bin
    astsbindir => /usr/sbin
    ; Everything Asterisk writes lives on emptyDirs; the image is read-only.
    astrundir => /var/run/asterisk
    astlogdir => /var/log/asterisk
    astspooldir => /var/spool/asterisk
    astdbdir => /var/spool/asterisk
    astcachedir => /var/spool/asterisk

    [options]
    documentation_language = en_US
    hideconnect = yes

  logger.conf: |
    [general]
    dateformat = %F %T.%3q

    [logfiles]
    ; The container log. -v on the command line sets the verbosity.
    console => notice,warning,error,verbose

  modules.conf: |
    [modules]
    autoload = no

    ; Core plumbing
    load => res_timing_timerfd.so
    load => res_pjproject.so
    load => res_sorcery_config.so
    load => res_sorcery_memory.so
    load => res_sorcery_astdb.so
    load => res_rtp_asterisk.so

    ; PJSIP
    load => res_pjsip.so
    load => res_pjsip_session.so
    load => chan_pjsip.so
    load => res_pjsip_authenticator_digest.so
    load => res_pjsip_endpoint_identifier_user.so
    load => res_pjsip_registrar.so
    load => res_pjsip_sdp_rtp.so
    load => res_pjsip_nat.so
    load => res_pjsip_acl.so
    load => res_pjsip_caller_id.so
    load => res_pjsip_rfc3326.so
    load => res_pjsip_pubsub.so
    load => res_pjsip_notify.so
    load => res_pjsip_logger.so

    ; Codecs and file formats (format_pcm covers .ulaw/.alaw/.g722)
    load => codec_ulaw.so
    load => codec_alaw.so
    load => codec_g722.so
    load => format_pcm.so
    load => format_wav.so
    load => format_gsm.so

    ; Dialplan and applications
    load => pbx_config.so
    load => app_echo.so
    load => app_dial.so
    load => app_playback.so
    load => func_callerid.so
    load => bridge_simple.so
    load => bridge_native_rtp.so

    ; Release B: AudioSocket (loaded here to prove the image carries it)
    load => res_audiosocket.so
    load => app_audiosocket.so

  manager.conf: |
    ; AMI on 127.0.0.1. The pod is on the host network, so this is the
    ; NODE's loopback: every host-network process on the node can connect.
    ; No users yet; the agent's generated AMI user arrives with apply, and its
    ; secret, deny/permit and narrow classes are the real barrier
    ; (internal/compile, "manager.conf rules").
    [general]
    enabled = yes
    bindaddr = 127.0.0.1
    port = 5038
    displayconnects = no

  http.conf: |
    [general]
    enabled = no

  # Call records are off; nothing reads them.
  cdr.conf: |
    [general]
    enable = no

  cel.conf: |
    [general]
    enable = no

  # res_pjsip_notify declines to load without this file. The agent will send
  # Cisco's service-control NOTIFY over AMI PJSIPNotify with its own headers
  # (design §5); this stanza is for trying it by hand from the CLI.
  pjsip_notify.conf: |
    [cisco-restart]
    Event => service-control
    Subscription-State => active
    Content-Type => text/plain
    Content => action=restart

  rtp.conf: |
    [general]
    rtpstart = {{ $p.ports.rtpStart }}
    rtpend = {{ $p.ports.rtpEnd }}

  pjsip.conf: |
    [global]
    type = global
    user_agent = patchbay-e2e

    [transport-udp]
    type = transport
    protocol = udp
    bind = {{ $address }}:{{ $p.ports.sip }}

    [transport-tcp]
    type = transport
    protocol = tcp
    bind = {{ $address }}:{{ $p.ports.sip }}

    ; The endpoint settings the Cisco 79x5 needs (design §4): no rport
    ; forcing and no contact rewriting, caller ID by Remote-Party-ID.
    [{{ $endpoint }}]
    type = endpoint
    context = e2e
    disallow = all
    allow = ulaw
    auth = {{ $endpoint }}
    aors = {{ $endpoint }}
    direct_media = no
    ; Bind RTP to the advertised address. Unbound (the default), RTP leaves
    ; from whatever source the route picks: in kind, the pod bridge's
    ; 10.244.0.1 instead of the node IP in the SDP.
    media_address = {{ $address }}
    bind_rtp_to_media_address = yes
    force_rport = no
    rewrite_contact = no
    send_rpid = yes
    dtmf_mode = rfc4733

    [{{ $endpoint }}]
    type = auth
    auth_type = userpass
    username = {{ $endpoint }}
    password = {{ $password }}

    [{{ $endpoint }}]
    type = aor
    max_contacts = 1
    remove_existing = yes

  extensions.conf: |
    [general]
    static = yes
    writeprotect = yes

    [e2e]
    exten => {{ $s.echoNumber }},1,Answer()
     same => n,Echo()
     same => n,Hangup()
{{- end }}
