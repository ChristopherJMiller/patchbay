---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
    helm.sh/resource-policy: keep
  name: people.patchbay.chrismiller.xyz
spec:
  group: patchbay.chrismiller.xyz
  names:
    categories:
      - patchbay
    kind: Person
    listKind: PersonList
    plural: people
    singular: person
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.number
          name: Number
          type: string
        - jsonPath: .spec.name
          name: Display
          type: string
        - jsonPath: .status.state
          name: State
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: Person is a number that rings all of one person's devices.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: PersonSpec is the intended state of a person's number.
              properties:
                name:
                  description: |-
                    Name is the person's display and caller ID name. No control
                    characters (line breaks included); anything else is escaped wherever
                    it is rendered.
                  maxLength: 64
                  minLength: 1
                  pattern: ^[^\x00-\x1F\x7F-\x9F]*$
                  type: string
                number:
                  description: |-
                    Number is the person's extension, in the people range of the number
                    plan (3XX by default).
                  maxLength: 16
                  minLength: 1
                  pattern: ^[0-9]+$
                  type: string
                rings:
                  description: |-
                    Rings lists the devices that ring, all at once, when Number is
                    dialled. A target that does not exist is skipped (and reported in
                    status), not an error.
                  items:
                    description: |-
                      RingTarget names exactly one device, in the same namespace, that rings
                      when the person's number is dialled. Set phone or softphone, not both.
                    properties:
                      phone:
                        description: Phone is the name of a Phone.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      softphone:
                        description: Softphone is the name of a Softphone.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    type: object
                    x-kubernetes-validations:
                      - message: exactly one of phone or softphone must be set
                        rule: has(self.phone) != has(self.softphone)
                  maxItems: 16
                  minItems: 1
                  type: array
                  x-kubernetes-list-type: atomic
              required:
                - name
                - number
                - rings
              type: object
            status:
              description: PersonStatus is written only by the controller.
              properties:
                conditions:
                  description: |-
                    Conditions: NumberConflict, plus any reported by the controller about
                    unresolved ring targets.
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                observedGeneration:
                  description: ObservedGeneration is the .metadata.generation this status describes.
                  format: int64
                  type: integer
                state:
                  description: |-
                    State is a one-word summary for humans and `kubectl get`. It is not a
                    contract; tools read Conditions.
                  type: string
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
