---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
    helm.sh/resource-policy: keep
  name: phones.patchbay.chrismiller.xyz
spec:
  group: patchbay.chrismiller.xyz
  names:
    categories:
      - patchbay
    kind: Phone
    listKind: PhoneList
    plural: phones
    singular: phone
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.number
          name: Number
          type: string
        - jsonPath: .spec.label
          name: Label
          type: string
        - jsonPath: .status.state
          name: State
          type: string
        - jsonPath: .spec.model
          name: Model
          priority: 1
          type: string
        - jsonPath: .spec.mac
          name: MAC
          priority: 1
          type: string
        - jsonPath: .status.observed.address
          name: Address
          priority: 1
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            Phone is a provisioned hardware desk phone. Creating one is the whole
            onboarding step: patchbay renders its config, serves it over TFTP, and
            walks the phone to Registered.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: PhoneSpec is the intended state of a hardware desk phone.
              properties:
                firmware:
                  description: |-
                    Firmware is the load the phone should run, by the name the phone
                    reports and the SEP file's loadInformation carries, for example
                    SIP45.9-4-2SR4-3S. Empty means the driver's default load. Its files
                    are staged with `patchbay firmware load`, never committed.
                  maxLength: 64
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                  type: string
                label:
                  description: |-
                    Label is shown on the phone's line button and sent as its caller ID
                    name. Defaults to the resource name when empty. The driver derives
                    the phone's short screen label from it (for the 79x5: spaces removed,
                    at most 12 characters, with a warning condition when that changes it).
                    No control characters (line breaks included); anything else, quotes,
                    ampersands and semicolons too, is escaped wherever it is rendered.
                  maxLength: 64
                  pattern: ^[^\x00-\x1F\x7F-\x9F]*$
                  type: string
                mac:
                  description: |-
                    MAC is the phone's Ethernet address: 12 hex digits, no separators, any
                    case (normalised to upper case). It must be unique among Phones: when
                    two claim one MAC, the older keeps it and the newer gets
                    MACConflict=True.
                  pattern: ^[0-9A-Fa-f]{12}$
                  type: string
                model:
                  description: Model is the hardware model; it selects the driver.
                  enum:
                    - cisco-7945
                    - cisco-7965
                    - cisco-7975
                  type: string
                number:
                  description: |-
                    Number is the phone's own extension, in the device range of the number
                    plan (1XX by default).
                  maxLength: 16
                  minLength: 1
                  pattern: ^[0-9]+$
                  type: string
              required:
                - mac
                - model
                - number
              type: object
            status:
              description: PhoneStatus is written only by the controller.
              properties:
                conditions:
                  description: |-
                    Conditions: Ready, FirmwareAvailable, FirmwareCurrent, Provisioned,
                    Registered, ConfigCurrent, and Unsupported / NumberConflict /
                    MACConflict when they apply, and the LabelShortened warning.
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                handledRequest:
                  description: |-
                    HandledRequest is the value of the resync request annotation
                    (patchbay.chrismiller.xyz/resync-requested) the controller last acted
                    on. An annotation with a different value is a new request.
                  maxLength: 256
                  type: string
                humanAction:
                  description: |-
                    HumanAction is the exact instruction for a person, set whenever the
                    phone cannot make progress without one (connect it, stage firmware,
                    factory-reset it, power-cycle it). Empty when nothing is needed.
                  type: string
                lastAction:
                  description: LastAction is the most recent action taken on the phone.
                  properties:
                    at:
                      description: At is when the action was last sent.
                      format: date-time
                      type: string
                    attempts:
                      description: |-
                        Attempts counts how many times this kind has been sent for this
                        version, including the latest.
                      format: int32
                      minimum: 0
                      type: integer
                    kind:
                      description: Kind is what was done.
                      enum:
                        - resync
                        - restart
                        - rotateToken
                      type: string
                    version:
                      description: |-
                        Version is the config version the action was meant to bring the
                        device to. Empty for actions that are not about a config version.
                      type: string
                  required:
                    - at
                    - kind
                  type: object
                observed:
                  description: Observed is what the phone has been seen doing.
                  properties:
                    address:
                      description: |-
                        Address is the IP address the phone last fetched config or registered
                        from.
                      type: string
                    firmware:
                      description: |-
                        Firmware is the load the phone last reported (for example
                        SIP45.9-4-2SR4-3S, or jar45sccp.9-4-2SR4-3 while still on SCCP).
                      type: string
                    firstSeen:
                      description: |-
                        FirstSeen is when the phone was first seen fetching a file or
                        registering.
                      format: date-time
                      type: string
                    lastConfigFetch:
                      description: |-
                        LastConfigFetch is the most recent fetch of this phone's rendered
                        config.
                      properties:
                        at:
                          description: At is when the agent served it.
                          format: date-time
                          type: string
                        version:
                          description: Version is the config version of the file the device fetched.
                          type: string
                      required:
                        - at
                        - version
                      type: object
                    lastRegistered:
                      description: |-
                        LastRegistered is the last time the phone was seen holding a SIP
                        registration.
                      format: date-time
                      type: string
                    upgradeStartedAt:
                      description: |-
                        UpgradeStartedAt is when the phone was first seen fetching firmware
                        for the upgrade in progress. Cleared when the upgrade ends.
                      format: date-time
                      type: string
                  type: object
                observedGeneration:
                  description: ObservedGeneration is the .metadata.generation this status describes.
                  format: int64
                  type: integer
                state:
                  description: |-
                    State is a one-word summary for humans and `kubectl get`. It is not a
                    contract and its values may change; tools read Conditions.
                  type: string
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
