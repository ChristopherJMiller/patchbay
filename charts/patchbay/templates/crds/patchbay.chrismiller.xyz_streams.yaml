---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
    helm.sh/resource-policy: keep
  name: streams.patchbay.chrismiller.xyz
spec:
  group: patchbay.chrismiller.xyz
  names:
    categories:
      - patchbay
    kind: Stream
    listKind: StreamList
    plural: streams
    singular: stream
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.number
          name: Number
          type: string
        - jsonPath: .spec.name
          name: Display
          type: string
        - jsonPath: .status.state
          name: State
          type: string
        - jsonPath: .spec.source
          name: Source
          priority: 1
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            Stream is a number that plays live audio from a source URL, holding the
            source (a tuner) only while someone listens. Release B.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: |-
                StreamSpec is the intended state of a dialable live-audio stream
                (release B, design §9).
              properties:
                name:
                  description: Name is the stream's display and caller ID name.
                  maxLength: 64
                  minLength: 1
                  type: string
                number:
                  description: |-
                    Number is the stream's extension, in the streams range of the number
                    plan (7XX by default).
                  maxLength: 16
                  minLength: 1
                  pattern: ^[0-9]+$
                  type: string
                source:
                  description: |-
                    Source is the absolute URL the stream bridge reads audio from, for
                    example an HDHomeRun channel (http://192.168.0.58:5004/auto/v5.1).
                    The controller never probes it: a probe would hold a tuner.
                  maxLength: 2048
                  type: string
                  x-kubernetes-validations:
                    - message: source must be an absolute URL with a scheme and host
                      rule: isURL(self) && url(self).getScheme() != '' && url(self).getHost() != ''
              required:
                - name
                - number
                - source
              type: object
            status:
              description: StreamStatus is written only by the controller.
              properties:
                conditions:
                  description: 'Conditions: NumberConflict, plus the stream conditions of release B.'
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                observedGeneration:
                  description: ObservedGeneration is the .metadata.generation this status describes.
                  format: int64
                  type: integer
                state:
                  description: |-
                    State is a one-word summary for humans and `kubectl get` (Idle,
                    Playing, Failing). It is not a contract; tools read Conditions.
                  type: string
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
