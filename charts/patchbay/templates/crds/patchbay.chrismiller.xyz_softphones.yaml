---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
    helm.sh/resource-policy: keep
  name: softphones.patchbay.chrismiller.xyz
spec:
  group: patchbay.chrismiller.xyz
  names:
    categories:
      - patchbay
    kind: Softphone
    listKind: SoftphoneList
    plural: softphones
    singular: softphone
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.number
          name: Number
          type: string
        - jsonPath: .spec.label
          name: Label
          type: string
        - jsonPath: .status.state
          name: State
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            Softphone is a SIP client on a laptop or handset, provisioned by scanning a
            QR code. Adding a softphone is creating one of these.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: SoftphoneSpec is the intended state of a software SIP client (Linphone).
              properties:
                label:
                  description: |-
                    Label is the softphone's display and caller ID name. Defaults to the
                    resource name when empty.
                  maxLength: 64
                  type: string
                number:
                  description: |-
                    Number is the softphone's own extension, in the device range of the
                    number plan (1XX by default).
                  maxLength: 16
                  minLength: 1
                  pattern: ^[0-9]+$
                  type: string
              required:
                - number
              type: object
            status:
              description: SoftphoneStatus is written only by the controller.
              properties:
                conditions:
                  description: |-
                    Conditions: Ready, Provisioned, Registered, ConfigCurrent, and
                    NumberConflict when it applies.
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                humanAction:
                  description: |-
                    HumanAction is the exact instruction for a person, when the softphone
                    cannot make progress without one. Empty when nothing is needed.
                  type: string
                lastAction:
                  description: LastAction is the most recent action taken on the softphone.
                  properties:
                    at:
                      description: At is when the action was last sent.
                      format: date-time
                      type: string
                    attempts:
                      description: |-
                        Attempts counts how many times this kind has been sent for this
                        version, including the latest.
                      format: int32
                      minimum: 0
                      type: integer
                    kind:
                      description: Kind is what was done.
                      enum:
                        - resync
                        - restart
                        - rotateToken
                      type: string
                    version:
                      description: |-
                        Version is the config version the action was meant to bring the
                        device to. Empty for actions that are not about a config version.
                      type: string
                  required:
                    - at
                    - kind
                  type: object
                observed:
                  description: Observed is what the softphone has been seen doing.
                  properties:
                    address:
                      description: |-
                        Address is the IP address the softphone last fetched its provisioning
                        document or registered from.
                      type: string
                    firstSeen:
                      description: |-
                        FirstSeen is when the softphone was first seen fetching its
                        provisioning document or registering.
                      format: date-time
                      type: string
                    lastConfigFetch:
                      description: |-
                        LastConfigFetch is the most recent fetch of the softphone's
                        provisioning document.
                      properties:
                        at:
                          description: At is when the agent served it.
                          format: date-time
                          type: string
                        version:
                          description: Version is the config version of the file the device fetched.
                          type: string
                      required:
                        - at
                        - version
                      type: object
                    lastRegistered:
                      description: |-
                        LastRegistered is the last time the softphone was seen holding a SIP
                        registration. A softphone with this set and no contact now is Offline
                        (asleep), not broken.
                      format: date-time
                      type: string
                  type: object
                observedGeneration:
                  description: ObservedGeneration is the .metadata.generation this status describes.
                  format: int64
                  type: integer
                provisioningURL:
                  description: |-
                    ProvisioningURL is the one-time Linphone remote-provisioning URL. The
                    token in it is spent on first use; `patchbay softphone qr --reissue`
                    asks for a new one. It is served on the LAN only.
                  type: string
                state:
                  description: |-
                    State is a one-word summary for humans and `kubectl get`. It is not a
                    contract; tools read Conditions.
                  type: string
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
