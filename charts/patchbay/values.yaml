# patchbay chart values. The design is docs/design.md; §6 covers the chart.
#
# One install is one PBX: the controller (any node) plus the PBX pod
# (Asterisk, the agent and the file server) pinned to pbx.nodeName on the
# host network.
# The namespace must allow hostNetwork pods, e.g. the label
# pod-security.kubernetes.io/enforce=privileged.

# The patchbay image: one binary that runs the controller, the agent and the
# file server.
image:
  repository: ghcr.io/christopherjmiller/patchbay
  # Defaults to the chart's appVersion.
  tag: ""
  # Pin by digest in production ("sha256:..."); the tag is then informational.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The install's settings: the chart renders them, with pbx.address and
# pbx.ports, into <fullname>-settings (settings.json), which the controller
# reads at start and compiles every phone's config from. Changing one
# restarts the controller (a checksum annotation), which recompiles.

# The time zone phones show, as an IANA name. The Cisco 79x5 takes only
# zones it has a name for: America/Los_Angeles, America/Denver,
# America/Phoenix, America/Chicago, America/New_York, America/Anchorage,
# Pacific/Honolulu, Europe/London and UTC (and their tzdata aliases, such
# as US/Pacific). The controller refuses to start with any other, naming
# them (cisco79x5.TimeZones).
timezone: UTC
# The NTP server phones use, as an IP address: the voice VLAN's gateway.
ntpServer: 192.168.20.1
# Which numbers mean what (design §4). Patterns use Asterisk's notation: X
# is one digit, a trailing "." one or more digits, "*" and "#" are literal.
# Quote every value: they are strings ("0" and "600", not numbers).
numberPlan:
  # Phones and softphones.
  devices: "1XX"
  # People (ring several devices).
  people: "3XX"
  # Streams (release B).
  streams: "7XX"
  # The echo test.
  echoTest: "600"
  # Plays "this phone cannot call emergency services".
  emergency: "911"
  # Each plays "not available".
  reserved: ["2XX", "0", "9.", "*8"]
# The networks phones register from: the PJSIP ACL refuses every other
# source and contact (the voice VLAN and the LAN).
allowedNetworks:
  - 192.168.20.0/24
  - 192.168.0.0/24
# House defaults for Phones, rendered into settings.json's phoneDefaults
# (compile.Settings.PhoneDefaults). A default fills each field a Phone
# leaves unset, field by field: a Phone's own value always wins. Changing
# one changes settings.json, so it rolls only the controller
# (checksum/settings), never the PBX pod (checksum/asterisk-restart): the
# new controller recompiles and resyncs each phone whose config changed,
# and no call drops.
#
# phoneDefaults.display is the house default for Phone.spec.display: when
# the phones' screens are on (power saving). Unset (the default),
# settings.json has no phoneDefaults, and a phone without a spec.display of
# its own keeps Cisco's schedule (on at 07:30 for 10h30m, Monday to Friday;
# otherwise off, and on for 1h after a key press). Set, even to {}, it
# applies to every Phone whose model supports it (displayPowerSave in
# `patchbay models`; untested on a real 7945 until the bench,
# docs/plans/release-a.md §8), under the Phone's own display; a model
# without it ignores it.
#
# On a Cisco 79x5 the screen is on, on each day of onWindow.days, from
# onWindow.start for onWindow.duration. Outside that window it is off: a
# key press or lifting the handset turns it on, and it turns off again once
# the phone is idle for idleTimeout. With wakeOnCall a ringing call turns it
# on too. Without onWindow no day has a window, so the screen is off but for
# idleTimeout after a key press (or a call, with wakeOnCall): the way to
# turn the screens off soon after use.
#
# The chart checks the field names and types; the controller checks the
# values at start and refuses to start, naming the field, as the API server
# refuses them in a Phone.
#
# phoneDefaults:
#   display:
#     # Outside the window, how long the screen stays on after a key
#     # press: whole minutes from 1m to 23h59m, as a duration ("1m",
#     # "90m", "1h30m"). Unset: the phone's own (1h on the 79x5).
#     idleTimeout: 1m
#     # Turn the screen on for a ringing call: true or false. Unset: the
#     # phone's own (off on the 79x5).
#     wakeOnCall: true
#     # The daily window the screen stays on. Unset: no day has one. It is
#     # one field: a Phone's own onWindow replaces this one whole, and a
#     # Phone cannot remove it.
#     onWindow:
#       # When it turns on: HH:MM on a 24-hour clock, in the time zone
#       # above. Quote it.
#       start: "07:30"
#       # How long it stays on: whole minutes from 1m to 24h.
#       duration: 10h30m
#       # The days with the window, each once, at least one: Monday,
#       # Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday.
#       days: [Monday, Tuesday, Wednesday, Thursday, Friday]
phoneDefaults: {}

# The voice of the PBX's spoken prompts (911's "This phone cannot call
# emergency services", "That number is not available"). The image carries
# the prompts in each of these voices, rendered from text at build time,
# and nothing else is accepted (the chart fails to render; the agent
# refuses to start):
#   espeak    espeak-ng's en-us voice: clear, robotic (the default)
#   ljspeech  Piper, US English, female (LJ Speech)
#   kristin   Piper, US English, female
#   norman    Piper, US English, male
#   john      Piper, US English, male
# Every Piper voice here is trained on public domain recordings; Piper's
# lessac-based voices are left out, for their dataset's research-only
# licence. docs/sounds.md has each voice's licence and lineage. Changing it
# restarts the PBX pod: the agent installs the voice at start.
sounds:
  voice: espeak

# The stream bridge (release B, design §9): dialling a Stream's number
# plays its live source (a TV channel from a tuner, internet radio) through
# patchbay stream-bridge, which holds a source only while someone listens.
# Off, no bridge is configured and every Stream's number plays "not
# available". The chart renders its AudioSocket address,
# <fullname>-streams.<namespace>.svc:<ports.audioSocket>, into the settings.
#
# The bridge is one Deployment, <fullname>-streams (one replica, Recreate:
# two bridges would hold two tuners for one channel), and a Service of that
# name. It mounts the <fullname>-streams ConfigMap, which the controller
# compiles from the Streams (streams.json), so the pod waits in
# ContainerCreating until the controller's first compile. It holds no
# Kubernetes credentials, and serves its observations, metrics and probes
# on the control port without a token (nothing in them is secret). A
# restart of the bridge drops every stream call; phone calls are unaffected.
streamBridge:
  enabled: true
  # The bridge's image: patchbay plus Alpine's ffmpeg (the Dockerfile's
  # stream-bridge target), Apache-2.0 AND GPL-3.0-or-later.
  image:
    repository: ghcr.io/christopherjmiller/patchbay-stream-bridge
    # Defaults to the chart's appVersion.
    tag: ""
    # Pin by digest in production ("sha256:..."); a released chart does.
    digest: ""
    pullPolicy: IfNotPresent
  ports:
    # AudioSocket, from Asterisk to the bridge (design §9: 9092).
    audioSocket: 9092
    # The bridge's control API: observations for the controller, metrics.
    control: 9093
  # zap log level: debug, info or error. One line per call and per source
  # started, stopped or failed; never any audio.
  logLevel: info
  # One ffmpeg per source playing (at most 8 at once), each decoding to
  # 16 kHz mono.
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 512Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # At shutdown the bridge hangs up every call and stops ffmpeg (2 s, then
  # SIGKILL).
  terminationGracePeriodSeconds: 10

# Stream settings, rendered into settings.json's streams
# (compile.StreamSettings); a change rolls only the controller.
streams:
  # How long one call to a stream may last: Asterisk hangs up at it, so a
  # phone left off the hook cannot hold a tuner for ever. A duration,
  # whole seconds from 10s to 24h ("2h", "90m").
  callLimit: 2h
  # Tuner pools: the tuner devices whose tuners a stream holds while it
  # plays. A Stream whose source's host (its URL's host, any port) is one
  # of a pool's hosts counts against that pool: at most max of the pool's
  # sources play at once (everyone on one source shares it), and a call
  # that would need one more hears "not available" while the Stream
  # reports why. A source on no pool's host (internet radio) has no limit.
  # List every host form the Streams use (an IP and a name are two hosts).
  #
  # tunerPools:
  #   - name: hdhomerun          # a DNS label; Stream.status.tunerPool
  #     hosts: ["192.168.0.58"]  # as the Streams' source URLs write it
  #     max: 1                   # of its 2 tuners: the DVR keeps one
  tunerPools: []

# Phone messages (docs/operations.md, "Messages"): text on a desk phone's
# screen, from `Message` resources the controller decides and pushes.
# `patchbay phone message` creates them with your kubeconfig either way;
# this is the controller's messages endpoint, for callers inside the
# cluster without Kubernetes credentials (Home Assistant): it creates
# Messages from POST /v1/messages, withdraws them by key, and keeps the
# house state (quiet, away) Home Assistant PUTs to /v1/house in the
# <fullname>-house ConfigMap. Every controller replica serves it, on the
# Service <fullname>-messages: ClusterIP only, nothing new on the LAN.
#
# Every request needs `Authorization: Bearer <token>`, the token in a
# Secret you create (the controller never mints it: the caller must hold
# the same value): tokenSecret.name, key tokenSecret.key. The controller
# reads it on every request, so a rotation needs no restart; until it
# exists the endpoint answers 503.
messages:
  enabled: false
  # The endpoint's port, on the controller pods and the Service.
  port: 9441
  tokenSecret:
    # Required with enabled.
    name: ""
    key: token

controller:
  # One replica decides at a time (leader election); a second only speeds
  # up failover.
  replicas: 1
  leaderElect: true
  # zap log level: debug, info or error.
  logLevel: info
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

pbx:
  # The node the PBX pod is pinned to (its kubernetes.io/hostname label).
  # Required. Phones are provisioned with this node's address, so the PBX
  # never moves on its own.
  nodeName: ""
  # The address Asterisk binds SIP to and advertises in SDP, and the file
  # server and device HTTP bind: pbx.nodeName's LAN IP (e.g.
  # 192.168.0.240). Required. Changing it restarts the PBX pod (the SIP
  # transports are not reloadable), which waits, not ready, until the
  # controller has compiled for the new address.
  address: ""

  # Ports bound on the node (hostNetwork). None clashes with Talos or
  # Kubernetes (kubelet and the control plane use 10248-10259).
  ports:
    # Asterisk SIP, UDP and TCP (the Cisco 79x5 registers over TCP).
    # Changing it restarts the PBX pod, like pbx.address.
    sip: 5060
    # Asterisk RTP, UDP. Not declared as container ports (Kubernetes has no
    # port ranges); the router's voice-VLAN filter must match this range.
    rtpStart: 10000
    rtpEnd: 10099
    # File server: TFTP (phone config and firmware), UDP.
    tftp: 69
    # File server: Cisco HTTP config download (9.x phones try it before
    # TFTP), the same files as TFTP, TCP.
    ciscoHTTP: 6970
    # Agent: device HTTP (directory, softphone provisioning, XML services), TCP.
    deviceHTTP: 8088
    # Agent: control API for the controller (token-protected), TCP.
    control: 9440

  # The signalling backend (design §8.5): only pjsip exists.
  signalling: pjsip

  # The pod's fsGroup: the group the agent gives every live config file
  # Asterisk must read (Asterisk's own group). The file server drops it.
  fsGroup: 1000
  podAnnotations: {}
  # The pod is pinned by nodeSelector; add tolerations if that node is tainted.
  tolerations: []
  terminationGracePeriodSeconds: 30

  asterisk:
    image:
      repository: andrius/asterisk
      tag: 22.11.0_debian-trixie
      # Multi-arch index digest (amd64, arm64). Bump tag and digest together:
      #   docker buildx imagetools inspect andrius/asterisk:<tag>
      digest: sha256:7ef51d47e9e670309b55cc287bbee64df75832b690e019cc7125c491c34f67b2
      pullPolicy: IfNotPresent
    # 1000 is the image's asterisk user. Asterisk runs as it directly; the
    # image's root entrypoint (chown, then privilege drop) is bypassed.
    runAsUser: 1000
    runAsGroup: 1000
    # Console verbosity (asterisk -v count): the container log.
    verbosity: 3
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

  agent:
    # The agent's control API token is minted by the controller into
    # <fullname>-agent-token (32 random bytes, design §4): nothing to
    # create. Until the controller has written it, the PBX pod waits in
    # ContainerCreating (the kubelet retries the Secret volume); the agent
    # then waits for <fullname>-pbx-config and <fullname>-pbx-secrets, the
    # compiled bundle, and Asterisk starts once the first version is
    # applied.
    logLevel: info
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

  # The file server (patchbay fileserver): TFTP and HTTP :6970. It starts as
  # root with only NET_BIND_SERVICE, SETUID and SETGID, binds both ports on
  # pbx.address, then drops to 65533:65533 with no groups and no
  # capabilities before it opens a file (docs/e2e.md, "Privileged ports").
  fileserver:
    logLevel: info
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi

# The PBX's persistent volume, mounted whole: the firmware store (Cisco
# firmware staged by `patchbay firmware load`, never in git, design §12) and
# the agent's spent provisioning tokens. Read-write in the agent, read-only
# in the file server. Without persistence it is an emptyDir, and both are
# lost with the pod. The PBX pod is pinned, so ReadWriteOnce is fine.
firmware:
  persistence:
    enabled: true
    size: 1Gi
    # "" uses the cluster's default StorageClass.
    storageClassName: ""
    # Keep the volume on `helm uninstall`; restaging firmware is manual.
    keep: true

# A prometheus-operator PodMonitor for the controller's metrics, the
# agent's and the stream bridge's (/metrics on their control ports, no
# token).
podMonitor:
  enabled: false
  # Without release: prometheus, this cluster's Prometheus ignores it.
  labels:
    release: prometheus
  interval: 30s
