# patchbay chart values. The design is docs/design.md; §6 covers the chart.
#
# One install is one PBX: the controller (any node) plus the PBX pod
# (Asterisk + the agent) pinned to pbx.nodeName on the host network.
# The namespace must allow hostNetwork pods, e.g. the label
# pod-security.kubernetes.io/enforce=privileged.

# The patchbay image: one binary that runs the controller and the agent.
image:
  repository: ghcr.io/christopherjmiller/patchbay
  # Defaults to the chart's appVersion.
  tag: ""
  # Pin by digest in production ("sha256:..."); the tag is then informational.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

controller:
  # One replica decides at a time (leader election); a second only speeds
  # up failover.
  replicas: 1
  leaderElect: true
  # zap log level: debug, info or error.
  logLevel: info
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

pbx:
  # The node the PBX pod is pinned to (its kubernetes.io/hostname label).
  # Required. Phones are provisioned with this node's address, so the PBX
  # never moves on its own.
  nodeName: ""
  # The address Asterisk binds SIP to and advertises in SDP: pbx.nodeName's
  # LAN IP (e.g. 192.168.0.240). Required.
  address: ""

  # Ports bound on the node (hostNetwork). None clashes with Talos or
  # Kubernetes (kubelet and the control plane use 10248-10259).
  ports:
    # Asterisk SIP, UDP and TCP (the Cisco 79x5 registers over TCP).
    sip: 5060
    # Asterisk RTP, UDP. Not declared as container ports (Kubernetes has no
    # port ranges); the router's voice-VLAN filter must match this range.
    rtpStart: 10000
    rtpEnd: 10099
    # Agent: TFTP (phone config and firmware), UDP.
    tftp: 69
    # Agent: Cisco HTTP config download (9.x phones try it before TFTP), TCP.
    ciscoHTTP: 6970
    # Agent: device HTTP (directory, softphone provisioning, XML services), TCP.
    deviceHTTP: 8088
    # Agent: control API for the controller (token-protected), TCP.
    control: 9440

  # Shared by both containers: the group that owns the live-config volume
  # the agent writes and Asterisk reads.
  fsGroup: 1000
  podAnnotations: {}
  # The pod is pinned by nodeSelector; add tolerations if that node is tainted.
  tolerations: []
  terminationGracePeriodSeconds: 30

  asterisk:
    image:
      repository: andrius/asterisk
      tag: 22.11.0_debian-trixie
      # Multi-arch index digest (amd64, arm64). Bump tag and digest together:
      #   docker buildx imagetools inspect andrius/asterisk:<tag>
      digest: sha256:1817983370bf2bcd645e836f9149cd1a743fef2f48a47b59bd77a86fd4b48b9b
      pullPolicy: IfNotPresent
    # 1000 is the image's asterisk user. Asterisk runs as it directly; the
    # image's root entrypoint (chown, then privilege drop) is bypassed.
    runAsUser: 1000
    runAsGroup: 1000
    # Console verbosity (asterisk -v count): the container log.
    verbosity: 3
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

  agent:
    # The Secret holding the control API bearer token under the key "token".
    # Default: <fullname>-agent-token. The controller will mint it (design
    # §4); until it does, create it before installing:
    #   kubectl create secret generic <fullname>-agent-token \
    #     --from-literal=token="$(head -c 32 /dev/urandom | base64)"
    # The PBX pod waits in ContainerCreating until the Secret exists.
    tokenSecretName: ""
    logLevel: info
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

  # TEMPORARY, e2e only. A hand-written Asterisk config (one endpoint, an
  # echo test) mounted straight into Asterisk, until the agent applies
  # compiled bundles (design §5). Never enable it in a real install.
  staticConfig:
    enabled: false
    # The one PJSIP endpoint (also its auth username).
    endpoint: e2e-phone
    # A test-only password. Required when enabled.
    password: ""
    # Dialling this answers and echoes audio back.
    echoNumber: "600"

# The firmware store: Cisco firmware staged by `patchbay firmware load`.
# Never in git (design §12). The PBX pod is pinned, so ReadWriteOnce is fine.
firmware:
  persistence:
    enabled: true
    size: 1Gi
    # "" uses the cluster's default StorageClass.
    storageClassName: ""
    # Keep the volume on `helm uninstall`; restaging firmware is manual.
    keep: true

# A prometheus-operator PodMonitor for the controller's metrics (the agent
# joins once it exports metrics).
podMonitor:
  enabled: false
  # Without release: prometheus, this cluster's Prometheus ignores it.
  labels:
    release: prometheus
  interval: 30s
