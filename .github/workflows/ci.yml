# CI: everything runs inside the repo's flake (`nix develop -c …`), so a job
# here runs exactly the toolchain `nix develop` gives you locally. To reproduce
# a red job, run the same `make` target in the same shell.
#
# Actions are pinned by full commit SHA with the release as a comment;
# Renovate (renovate.json) keeps both up to date.
#   - cachix/install-nix-action: upstream Nix, multi-user, flakes enabled.
#   - nix-community/cache-nix-action: caches /nix in the GitHub Actions cache.
#     (DeterminateSystems/magic-nix-cache-action was shut down in Feb 2025 and
#     revived in mid-2025. By default it sends diagnostics to Determinate and
#     tries FlakeHub, which needs `id-token: write`. So we don't use it.)
#
# `ci-ok` is the one check the main ruleset requires: it passes only when
# check, e2e and image all passed, so Renovate's PRs auto-merge on it and
# nothing else (docs/releasing.md). Publishing happens only in the publish
# job, on a push to main (image `sha-<commit>`, `main`) or a `v*` tag
# (image `<version>`, `<major>.<minor>`, then the chart, pinned to that
# image's digest, and the GitHub release), and only after every test
# passed. No other job can write packages: a PR's run holds a read-only
# token.
name: CI

on:
  push:
    # Renovate branches always have a PR; don't run them twice.
    branches-ignore: ["renovate/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Weekly on main, with no change of ours: new vulnerability reports,
  # pinned images or digests that disappeared, a runner image that moved.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded runs on a branch or PR are cancelled. Every commit on main
  # still gets a full result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: generate, lint, test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: check-hygiene runs gitleaks over every commit.
          fetch-depth: 0

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # The dev shell closure (~2.3 GiB) is keyed on the flake. Only an exact
      # key match is restored, and there is no GC, so a saved cache holds only
      # the current closure, plus what `make sounds` builds below (the
      # flake's piper, ~1 GiB, and piper-voices, ~250 MB), which the image
      # and publish jobs then restore with it. This job saves the cache and
      # the others only restore it.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}

      - name: Dev shell (tool versions)
        run: nix develop -c make tools-versions

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'flake.lock') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-

      - name: Generated files are committed
        run: |
          nix develop -c make generate
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git --no-pager diff
            echo "::error::'make generate' changed the tree: run it locally and commit the result"
            exit 1
          fi

      - name: go.mod is tidy
        run: nix develop -c go mod tidy -diff

      - name: Repository hygiene (no binaries, firmware or secrets)
        run: nix develop -c make check-hygiene

      - name: Workflows (actionlint)
        run: nix develop -c actionlint

      # Only vulnerabilities in code patchbay actually calls (govulncheck
      # works at the symbol level), in our modules and in the standard
      # library of the Go that builds the image (the Dockerfile's builder,
      # see the Makefile). A red run with no change of ours means a module
      # or Go patch release is due; Renovate's PR for it turns this green.
      - name: Known vulnerabilities (govulncheck)
        run: nix develop -c make vulncheck

      - name: Lint and test (unit + envtest)
        run: nix develop -c make lint test

      # The 911 and "not available" prompts the image carries, in every
      # voice: espeak-ng and ffmpeg from the dev shell, Piper and its voices
      # from the flake's piper and piper-voices packages, which gen-sounds
      # builds (the voices are fixed-output fetches from Hugging Face, ~60 MB
      # each, pinned by sha256; the nix cache above keeps both). Each voice
      # is rendered twice and compared (hack/gen-sounds.sh fails if the two
      # differ). make image, and so the e2e job, renders them again before
      # the build.
      - name: Sound prompts (reproducible)
        run: nix develop -c make sounds

      # Every compile golden booted in the chart's pinned Asterisk image, the
      # way the PBX pod runs it, then registered to and called as each
      # device. Plain docker on the runner (no cluster), so it lives here
      # rather than in the kind job; the container has no network.
      - name: Compiled config in real Asterisk
        run: nix develop -c make asterisk-check

  e2e:
    name: e2e (kind)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Contract with the harness (`make e2e`, test/e2e):
    #   - one kind cluster named patchbay-e2e;
    #   - its kubeconfig at .e2e/kubeconfig (never uploaded);
    #   - every diagnostic it dumps on failure goes under .e2e/.
    # On failure the steps below add `kind export logs` plus a cluster
    # snapshot, then upload .e2e/ as an artifact.
    env:
      E2E_DIR: ${{ github.workspace }}/.e2e
      # kubectl/helm discovery cache (the harness and Makefile use the same).
      KUBECACHEDIR: ${{ github.workspace }}/.e2e/kube-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          save: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'flake.lock') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-

      - name: e2e
        # A step timeout counts as a failure, so the diagnostics steps still
        # run. A job timeout would cancel them.
        timeout-minutes: 45
        # Keep the cluster, pass or fail, so the failure steps below can
        # export node logs from it. The runner is thrown away afterwards.
        env:
          PATCHBAY_E2E_KEEP: "1"
        run: nix develop -c make e2e

      - name: Collect cluster diagnostics
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p "$E2E_DIR/ci"
          if ! nix develop -c kind get clusters | grep -qx patchbay-e2e; then
            echo "no patchbay-e2e cluster to collect from"
            exit 0
          fi
          nix develop -c kind export logs "$E2E_DIR/ci/kind-logs" --name patchbay-e2e || true
          kc=(nix develop -c kubectl --kubeconfig "$E2E_DIR/kubeconfig")
          "${kc[@]}" get all,events -A -o wide > "$E2E_DIR/ci/cluster.txt" 2>&1 || true
          "${kc[@]}" get phones,softphones,people,streams -A -o yaml \
            > "$E2E_DIR/ci/patchbay-resources.yaml" 2>&1 || true

      - name: Upload e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/.e2e/
            !${{ github.workspace }}/.e2e/kubeconfig
            !${{ github.workspace }}/.e2e/kube-cache/
            !${{ github.workspace }}/.e2e/bin/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # Every event: both architectures build. Nothing is pushed and the token
  # can only read, so a PR's code (its flake, `make sounds`, the actions a
  # Renovate PR bumps) never runs with the right to publish.
  image:
    name: image (amd64, arm64)
    needs: [check, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          save: false

      # The image copies build/sounds/ (every voice); the check job already
      # proved the render is reproducible, and its nix cache brings Piper
      # and the voices.
      - name: Sound prompts
        run: nix develop -c make sounds

      # The Dockerfile cross-compiles on the build platform and its final
      # stage has no RUN, so arm64 needs no emulation.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The same build arguments as publish's, so its build hits this cache.
      - name: Build arguments
        id: args
        run: echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            DATE=${{ steps.args.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A push to main (`sha-<7>`, `main`) or a v* tag (`<version>`,
  # `<major>.<minor>`) only, after every test passed: the one job that may
  # push to ghcr.io. Each primary tag (`sha-<7>` on main, `<version>` on a
  # tag) is written once: a re-run finds it and reuses its digest rather
  # than push another build under the same name. The digest goes to
  # release, which pins the chart to it.
  publish:
    name: publish (ghcr.io)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [check, e2e, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # sign the build provenance (Sigstore, keyless)
      attestations: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    env:
      IMAGE: ghcr.io/christopherjmiller/patchbay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          save: false

      - name: Sound prompts
        run: nix develop -c make sounds

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          # sha-<7> is what deployments of main pin (with the digest), and
          # only main's build carries it; main moves.
          tags: |
            type=sha,prefix=sha-,format=short,enable=${{ github.ref_type != 'tag' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # The primary tag, the version stamped into the binary, and the commit
      # time as its date (as the Makefile does), so two builds of one
      # commit stamp the same binary.
      - name: Primary tag
        id: primary
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            v="${GITHUB_REF_NAME#v}"
            if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::tag $GITHUB_REF_NAME is not v<semver>"
              exit 1
            fi
            echo "tag=$v" >> "$GITHUB_OUTPUT"
            echo "version=$v" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "version=main" >> "$GITHUB_OUTPUT"
          fi
          echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Already published?
        id: existing
        env:
          TAG: ${{ steps.primary.outputs.tag }}
        run: |
          if manifest=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' 2>/dev/null); then
            digest=$(jq -r .digest <<<"$manifest")
            echo "::notice::${IMAGE}:${TAG} is already published (${digest}): not pushed again"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        if: steps.existing.outputs.digest == ''
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.primary.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.primary.outputs.date }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

      # Verify with: gh attestation verify oci://<image>@<digest> --repo ChristopherJMiller/patchbay
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.existing.outputs.digest == ''
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Published
        id: digest
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
          PRIMARY: ${{ steps.primary.outputs.tag }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no image digest (got '$DIGEST')"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "### Published"
            echo
            echo "Pin: \`${IMAGE}:${PRIMARY}@${DIGEST}\`"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # A v* tag: the chart (version and appVersion = the tag, the image pinned
  # by the digest publish pushed) as a GitHub release asset, and the Helm
  # repository index on gh-pages, served at
  # https://christopherjmiller.github.io/patchbay. This is chart-releaser's
  # layout, done in four commands because the app and the chart share one
  # version (chart-releaser-action releases a chart only when charts/
  # changed).
  release:
    name: release (chart + GitHub release)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # the GitHub release and the gh-pages index
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only this checkout keeps its credentials: the index is pushed from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: .pages

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          save: false

      # The released chart runs exactly the image publish pushed for this
      # tag: tag and digest, never the tag alone.
      - name: Package the chart
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not v<semver>"
            exit 1
          fi
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::publish gave no image digest (got '$DIGEST')"
            exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          DIGEST="$DIGEST" nix develop -c yq -i '.image.digest = strenv(DIGEST)' charts/patchbay/values.yaml
          nix develop -c helm package charts/patchbay --version "$v" --app-version "$v" -d dist
          nix develop -c helm template patchbay "dist/patchbay-${v}.tgz" \
            --set pbx.nodeName=n --set pbx.address=192.0.2.10 > dist/rendered.yaml
          want="ghcr.io/christopherjmiller/patchbay:${v}@${DIGEST}"
          if [[ "$(grep -c "image: \"${want}\"" dist/rendered.yaml)" -lt 3 ]]; then
            echo "::error::the packaged chart does not run ${want}"
            exit 1
          fi
          rm dist/rendered.yaml

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=()
          [[ "$VERSION" == *-* ]] && pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "dist/patchbay-${VERSION}.tgz" \
            --verify-tag --generate-notes --title "patchbay ${VERSION}" "${pre[@]}"

      - name: Helm repository index (gh-pages)
        run: |
          nix develop -c helm repo index dist \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            --merge .pages/index.yaml
          cp dist/index.yaml .pages/index.yaml
          cd .pages
          git add index.yaml
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "patchbay ${VERSION}"
          git push origin HEAD:gh-pages

  # The single required check (main ruleset). `needs` skips a job whose
  # dependency failed, so this runs always() and passes only if every
  # needed job succeeded: a failure, cancellation or skip anywhere is red.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [check, e2e, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every required job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          jq -e 'all(.[]; .result == "success")' <<<"$RESULTS" >/dev/null
