# Helm values for the e2e install (test/e2e). The harness adds at runtime:
#   pbx.nodeName, pbx.address   the kind node's name and InternalIP
#   *.podAnnotations            the loaded images' IDs, so a rebuilt image
#                               rolls the pods even though its tag is unchanged
#   allowedNetworks             the node's pod CIDR, where the phones run
image:
  repository: ghcr.io/christopherjmiller/patchbay
  tag: e2e
  # Loaded into kind from a host-platform `docker save` (harness loadImages); never pulled.
  pullPolicy: Never

# The phones' clock (the chart's default is UTC).
timezone: America/Los_Angeles

controller:
  logLevel: debug

pbx:
  asterisk:
    image:
      # The chart's own tag, pulled on the host BY DIGEST and loaded into kind
      # under that tag (`make e2e-images`). kind load cannot carry a registry
      # digest into containerd, so the reference here drops it.
      digest: ""
      pullPolicy: Never
  agent:
    logLevel: debug
  fileserver:
    logLevel: debug

firmware:
  persistence:
    keep: false

# The stream bridge (release B): the e2e build of its image, loaded with
# loaded into kind by the harness, never pulled (test/e2e/streamkit_test.go's
# streamBridgeImage).
streamBridge:
  image:
    tag: e2e
    pullPolicy: Never
  logLevel: debug

streams:
  # Short, so TestStreamRadio sees the PBX end a call at the limit.
  callLimit: 20s
  # The fake tuner (`fakephone source`, Service fake-tuner) is the pool:
  # one of its two tuners at a time, as the house's HDHomeRun.
  tunerPools:
    - name: tuner
      hosts: [fake-tuner.patchbay-e2e.svc]
      max: 1
