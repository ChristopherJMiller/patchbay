# The e2e cluster: one node (control plane and workloads). The node image is
# Kubernetes 1.33, the minor of the cluster patchbay is built for (galaxy,
# design §2) and the chart's kubeVersion floor, so e2e tests what ships; the
# image is kind v0.32.0's published v1.33.12 build (its release notes),
# pinned by digest. Move it, and Chart.yaml's floor, as that cluster moves.
# envtest covers the other end: kube-apiserver 1.37 from the flake.
# Create the cluster only through the harness or `make e2e-up`, which pass
# --name patchbay-e2e and --kubeconfig .e2e/kubeconfig (never ~/.kube/config).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.33.12@sha256:3f5c8443c620245e4d355cfe09e96a91ead32ceaa569d3f1ca9edf0cb2fe2ff4
