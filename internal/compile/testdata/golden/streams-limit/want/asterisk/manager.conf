; generated by patchbay; do not edit
; AMI on 127.0.0.1. The PBX pod is on the host network, so this is the
; node's loopback and any host-network process there can connect. The
; account's generated secret is the barrier: its system class, which the
; agent needs, also loads modules and adds dialplan, so whoever holds
; the secret controls this PBX.

[general]
enabled = yes
bindaddr = 127.0.0.1
port = 5038
displayconnects = no

[patchbay-agent]
secret = @@secret:patchbay-ami/password@@
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
read = system,reporting
write = system,reporting
