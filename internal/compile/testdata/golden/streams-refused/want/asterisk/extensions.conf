; generated by patchbay; do not edit

[general]
static = yes
writeprotect = yes

; Every device dials from here (pjsip endpoint context).
[patchbay-devices]

; Built in: the echo test
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; Built in: there is no outside line, so say so, three times
exten => 911,1,Answer()
 same => n,Playtones(!950/330,!1400/330,!1800/330)
 same => n,Wait(1)
 same => n,StopPlaytones()
 same => n,Playback(/var/lib/patchbay/sounds/no-emergency)
 same => n,Wait(1)
 same => n,Playback(/var/lib/patchbay/sounds/no-emergency)
 same => n,Wait(1)
 same => n,Playback(/var/lib/patchbay/sounds/no-emergency)
 same => n,Hangup()

; Stream king5: its source is refused (streams: the source's scheme is "rtsp"; only http and https are read)
exten => 705,1,Goto(patchbay-unavailable,s,1)

; Stream groovesalad: its source is refused (streams: the source is a playlist (.pls or .m3u); use one of the stream URLs it lists)
exten => 750,1,Goto(patchbay-unavailable,s,1)

; Stream dronezone
exten => 751,1,Answer()
 same => n,Set(TIMEOUT(absolute)=7200)
 same => n,Dial(AudioSocket/patchbay-streams.telephony.svc:9092/17654a6b-99f3-561e-92b4-7264ce1ca339/c(slin16),,gS(7200))
 same => n,Goto(patchbay-unavailable,s,1)

; Reserved: not available
exten => _2XX,1,Goto(patchbay-unavailable,s,1)
exten => 0,1,Goto(patchbay-unavailable,s,1)
exten => _9.,1,Goto(patchbay-unavailable,s,1)
exten => *8,1,Goto(patchbay-unavailable,s,1)

; Anything else: not available
exten => _X!,1,Goto(patchbay-unavailable,s,1)
exten => _[*#]!,1,Goto(patchbay-unavailable,s,1)

; The SIT tone, then "That number is not available."
[patchbay-unavailable]
exten => s,1,Answer()
 same => n,Playtones(!950/330,!1400/330,!1800/330)
 same => n,Wait(1)
 same => n,StopPlaytones()
 same => n,Playback(/var/lib/patchbay/sounds/not-available)
 same => n,Hangup()
