; generated by patchbay; do not edit

[global]
type = global
user_agent = patchbay
; A device is identified by the username of its digest Authorization:
; its ID. The first request of a dialog carries none, so it is challenged
; first (in realm default_realm), then matched.
default_realm = patchbay
endpoint_identifier_order = auth_username

[transport-udp]
type = transport
protocol = udp
bind = 192.168.0.240:5060

[transport-tcp]
type = transport
protocol = tcp
bind = 192.168.0.240:5060

[patchbay-acl]
; Every SIP request from anywhere but these networks is refused.
type = acl
deny = 0.0.0.0/0.0.0.0
permit = 192.168.20.0/24
permit = 192.168.0.0/24

; Phone lab, number 100
[phone-lab]
type = endpoint
context = patchbay-devices
transport = transport-tcp
aors = 100
auth = phone-lab
identify_by = auth_username
callerid = "R&D\; 'Lab' <1> Küche" <100>
disallow = all
allow = g722,ulaw
dtmf_mode = rfc4733
media_address = 192.168.0.240
bind_rtp_to_media_address = yes
direct_media = no
force_rport = no
rewrite_contact = no
rtp_symmetric = no
send_rpid = yes
send_pai = no
trust_id_inbound = no
trust_id_outbound = yes
contact_deny = 0.0.0.0/0.0.0.0
contact_permit = 192.168.20.0/24
contact_permit = 192.168.0.0/24

[phone-lab]
type = auth
auth_type = digest
username = phone-lab
password = @@secret:patchbay-phone-lab/sip-password@@

[100]
type = aor
max_contacts = 1
remove_existing = yes
default_expiration = 600
maximum_expiration = 600
qualify_frequency = 0

