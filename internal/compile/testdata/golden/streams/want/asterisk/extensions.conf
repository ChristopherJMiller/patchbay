; generated by patchbay; do not edit

[general]
static = yes
writeprotect = yes

; Every device dials from here (pjsip endpoint context).
[patchbay-devices]

; Built in: the echo test
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; Built in: there is no outside line, so say so, three times
exten => 911,1,Answer()
 same => n,Playtones(!950/330,!1400/330,!1800/330)
 same => n,Wait(1)
 same => n,StopPlaytones()
 same => n,Playback(/var/lib/patchbay/sounds/no-emergency)
 same => n,Wait(1)
 same => n,Playback(/var/lib/patchbay/sounds/no-emergency)
 same => n,Wait(1)
 same => n,Playback(/var/lib/patchbay/sounds/no-emergency)
 same => n,Hangup()

; Phone desk
exten => 100,1,Dial(PJSIP/phone-desk,30)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?noanswer)
 same => n,Goto(patchbay-unavailable,s,1)
 same => n(busy),Busy(5)
 same => n(noanswer),Hangup()

; Softphone chris-laptop
exten => 150,1,Dial(PJSIP/softphone-chris-laptop,30)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?noanswer)
 same => n,Goto(patchbay-unavailable,s,1)
 same => n(busy),Busy(5)
 same => n(noanswer),Hangup()

; Person chris
exten => 301,1,Dial(PJSIP/phone-desk&PJSIP/softphone-chris-laptop,30)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?noanswer)
 same => n,Goto(patchbay-unavailable,s,1)
 same => n(busy),Busy(5)
 same => n(noanswer),Hangup()

