; generated by patchbay; do not edit

[global]
type = global
user_agent = patchbay
; A device is identified by the username of its digest Authorization:
; its ID. The first request of a dialog carries none, so it is challenged
; first (in realm default_realm), then matched.
default_realm = patchbay
endpoint_identifier_order = auth_username

[transport-udp]
type = transport
protocol = udp
bind = 10.0.0.5:5070

[transport-tcp]
type = transport
protocol = tcp
bind = 10.0.0.5:5070

[patchbay-acl]
; Every SIP request from anywhere but these networks is refused.
type = acl
deny = 0.0.0.0/0.0.0.0
permit = 10.0.0.0/24

; Phone desk, number 400
[phone-desk]
type = endpoint
context = patchbay-devices
transport = transport-tcp
aors = 400
auth = phone-desk
identify_by = auth_username
callerid = "Desk" <400>
disallow = all
allow = g722,ulaw
dtmf_mode = rfc4733
media_address = 10.0.0.5
bind_rtp_to_media_address = yes
direct_media = no
force_rport = no
rewrite_contact = no
rtp_symmetric = no
send_rpid = yes
send_pai = no
trust_id_inbound = no
trust_id_outbound = yes
contact_deny = 0.0.0.0/0.0.0.0
contact_permit = 10.0.0.0/24

[phone-desk]
type = auth
auth_type = digest
username = phone-desk
password = @@secret:patchbay-phone-desk/sip-password@@

[400]
type = aor
max_contacts = 1
remove_existing = yes
default_expiration = 600
maximum_expiration = 600
qualify_frequency = 0

; Softphone chris-laptop, number 450
[softphone-chris-laptop]
type = endpoint
context = patchbay-devices
transport = transport-udp
aors = 450
auth = softphone-chris-laptop
identify_by = auth_username
callerid = "Chris (laptop)" <450>
disallow = all
allow = g722,ulaw
dtmf_mode = rfc4733
media_address = 10.0.0.5
bind_rtp_to_media_address = yes
direct_media = no
force_rport = yes
rewrite_contact = yes
rtp_symmetric = yes
send_rpid = no
send_pai = yes
trust_id_inbound = no
trust_id_outbound = yes
contact_deny = 0.0.0.0/0.0.0.0
contact_permit = 10.0.0.0/24

[softphone-chris-laptop]
type = auth
auth_type = digest
username = softphone-chris-laptop
password = @@secret:patchbay-softphone-chris-laptop/sip-password@@

[450]
type = aor
max_contacts = 1
remove_existing = yes
default_expiration = 600
maximum_expiration = 600
qualify_frequency = 0
